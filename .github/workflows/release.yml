name: Release

# Manual trigger only: this connector is built from public docs and has not been run against the live
# StreamOne ION API (WYREAI-322), so nothing publishes on push or pull_request. Add the push trigger
# back once it has been validated against a real ION account.
on:
  workflow_dispatch:

# Thin caller for the canonical reusable release pipeline. The build ->
# semantic-release -> Docker -> MCP Registry -> security chain lives in
# WYRE-AI/reusable-workflows so every *-mcp repo stays in lockstep instead
# of drifting per-repo. PR-time lint/test gating is test.yml's concern; this
# workflow only runs the release path.
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@2b0b056bd7544937e5cbd56cf2e1ff8a180a411f
    with:
      server-name: td-synnex-mcp
      image-name: ghcr.io/wyre-ai/td-synnex-mcp
    secrets: inherit
